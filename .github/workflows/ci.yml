name: Verification Django

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests et qualite
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      GROQ_API_KEY: test-key-without-real-token
      GROQ_MODEL: llama-3.3-70b-versatile

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install . black ruff

      - name: Verifier le formatage
        run: black --check .

      - name: Analyser le code
        run: ruff check .

      - name: Verifier Django
        run: python manage.py check

      - name: Preparer les fichiers statiques
        run: python manage.py collectstatic --noinput

      - name: Lancer les tests
        run: python manage.py test
